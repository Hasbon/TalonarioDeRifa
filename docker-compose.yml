services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rifa
      POSTGRES_PASSWORD: rifa_secret
      POSTGRES_DB: rifa_digital
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rifa -d rifa_digital"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://rifa:rifa_secret@db:5432/rifa_digital
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-long-random-secret}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
